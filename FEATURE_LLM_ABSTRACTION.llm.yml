## Migration Path

### For Users
1. **No action required** - Existing configurations continue to work
2. Optional: Add `llm = "claude-code"` to be explicit (not required)
3. Future: When Gemini is added, change to `llm = "gemini"`

### For Developers
1. Implement this abstraction layer first
2. Test thoroughly with existing configurations
3. Deploy without requiring any user changes
4. Later: Implement Gemini using FEATURE_GEMINI_LLM.llm.yml

## Key Design Principles

### 1. Zero Breaking Changes
- All existing configurations must work without modification
- Claude remains the default if no LLM is specified
- Fallback to direct Claude executor if factory fails

### 2. Gradual Migration
- Abstraction layer added alongside existing code
- Existing Claude implementation remains unchanged
- Resources can migrate to factory pattern gradually

### 3. Future Extensibility
- Clean interfaces for adding new LLM providers
- Configuration structure supports future parameters
- Stub implementations show extension points

### 4. Defensive Coding
- Factory falls back to Claude if provider unknown
- Resources fall back to direct Claude if factory fails
- Clear error messages for unsupported features

## Testing Requirements

### Must Pass Before Merge
1. All existing tests pass without modification
2. Existing Terraform configurations work unchanged
3. Provider accepts new parameters but doesn't require them
4. Gemini stub returns clear "not implemented" message
5. Factory creates Claude adapter successfully

### Performance Validation
- No performance degradation vs direct Claude usage
- Adapter adds minimal overhead
- Factory creation is fast

## Success Criteria

✅ Phase 1 is successful when:
1. All existing code continues to work
2. LLM abstraction is in place
3. Claude uses new abstraction internally
4. Gemini stub is ready for Phase 2
5. No user action required

This sets the foundation for adding Gemini in Phase 2 (FEATURE_GEMINI_LLM.llm.yml) without any risk to existing functionality.