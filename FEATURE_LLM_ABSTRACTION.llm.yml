## LLM Provider Support

The TofuKit provider currently supports Claude Code CLI for project generation. Support for additional LLM providers is planned for future releases.

### Current Configuration (No changes required)
```hcl
provider "tofukit" {
  claude_home_directory = "~/.claude"
  dry_run = false
  debug = true
}
```

### Future Configuration (Preview)
```hcl
provider "tofukit" {
  llm = "claude-code"  # Currently the only supported option
  claude_home_directory = "~/.claude"
  dry_run = false
}
```

The `llm` parameter is optional and defaults to `"claude-code"` for backwards compatibility.
