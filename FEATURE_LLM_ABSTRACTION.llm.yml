### Phase 3: Create LLM Factory

#### 3.1 Create Factory
**File**: `internal/llm/factory.go` (NEW)
```go
package llm

import (
	"fmt"
)

// NewExecutor creates an appropriate LLM executor based on configuration
// This is the main entry point for creating LLM executors
func NewExecutor(config Config) (Executor, error) {
	// Validate configuration
	if err := config.Validate(); err != nil {
		return nil, fmt.Errorf("invalid LLM configuration: %w", err)
	}

	switch config.Provider {
	case ProviderClaudeCode, "": // Default to Claude for backwards compatibility
		adapter := NewClaudeAdapter(config.ClaudeHomeDirectory, config.DryRun)
		adapter.SetDebug(config.Debug)
		if config.OutputPath != "" {
			adapter.SetOutputPath(config.OutputPath)
		}
		// Future: adapter.SetModel(config.ClaudeCodeModel)
		return adapter, nil

	case ProviderGemini:
		// Return stub for now, will be replaced in FEATURE_GEMINI_LLM.llm.yml
		return NewGeminiStub(config.GeminiAPIKey, config.DryRun), nil

	default:
		return nil, fmt.Errorf("unsupported LLM provider: %s", config.Provider)
	}
}

// GetDefaultProvider returns the default LLM provider
// This maintains backwards compatibility
func GetDefaultProvider() Provider {
	return ProviderClaudeCode
}
```

