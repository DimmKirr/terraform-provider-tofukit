### Phase 2: Create Adapter for Existing Claude Implementation

#### 2.1 Create Claude Adapter
**File**: `internal/llm/claude_adapter.go` (NEW)
```go
package llm

import (
	"context"
	"time"

	"github.com/tofukit/opentofu-provider-tofukit/internal/claude"
)

// ClaudeAdapter adapts the existing Claude executor to the new LLM interface
type ClaudeAdapter struct {
	executor *claude.Executor
	provider Provider
}

// NewClaudeAdapter creates a new adapter for the existing Claude implementation
func NewClaudeAdapter(claudeHomeDir string, dryRun bool) *ClaudeAdapter {
	return &ClaudeAdapter{
		executor: claude.NewExecutor(claudeHomeDir, dryRun),
		provider: ProviderClaudeCode,
	}
}

// Execute adapts the Claude executor's Execute method
func (a *ClaudeAdapter) Execute(ctx context.Context, projectSpec map[string]interface{}, outputDir string) (*ExecutionStatus, error) {
	// Call the existing Claude executor
	claudeStatus, err := a.executor.Execute(ctx, projectSpec, outputDir)
	if err != nil {
		return nil, err
	}

	// Convert claude.ExecutionStatus to llm.ExecutionStatus
	status := &ExecutionStatus{
		State:       claudeStatus.State,
		ProjectPath: claudeStatus.ProjectPath,
		Error:       claudeStatus.Error,
		Output:      claudeStatus.Output,
	}

	// Parse timestamps
	if claudeStatus.StartedAt != "" {
		if t, err := time.Parse(time.RFC3339, claudeStatus.StartedAt); err == nil {
			status.StartedAt = t
		}
	}

	if claudeStatus.CompletedAt != "" {
		if t, err := time.Parse(time.RFC3339, claudeStatus.CompletedAt); err == nil {
			status.CompletedAt = &t
		}
	}

	// Copy metadata
	status.Metadata = make(map[string]string)
	for k, v := range claudeStatus.Metadata {
		status.Metadata[k] = v
	}

	return status, nil
}

// SetDebug delegates to the underlying Claude executor
func (a *ClaudeAdapter) SetDebug(debug bool) {
	a.executor.SetDebug(debug)
}

// SetOutputPath delegates to the underlying Claude executor
func (a *ClaudeAdapter) SetOutputPath(outputPath string) {
	a.executor.SetOutputPath(outputPath)
}

// SetSystemPrompt delegates to the underlying Claude executor
func (a *ClaudeAdapter) SetSystemPrompt(systemPrompt string) {
	a.executor.SetSystemPrompt(systemPrompt)
}

// GetProvider returns the provider type
func (a *ClaudeAdapter) GetProvider() Provider {
	return a.provider
}

// SetModel sets the Claude model (for future use)
func (a *ClaudeAdapter) SetModel(model string) {
	// This will be implemented when claude.Executor supports model selection
	// For now, this is a no-op to prepare the interface
}
```

