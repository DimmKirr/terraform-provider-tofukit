### Phase 5: Update Resources to Use LLM Factory

#### 5.1 Update Project Resource
**File**: `internal/resources/project.go`

**BACKWARDS COMPATIBLE CHANGES**:
```go
import (
	"github.com/tofukit/opentofu-provider-tofukit/internal/llm"
	// Keep existing claude import for now
	"github.com/tofukit/opentofu-provider-tofukit/internal/claude"
)

// In executeProject method, REPLACE:
// OLD:
// executor := claude.NewExecutor(providerData.ClaudeHomeDirectory, dryRun)

// NEW:
executor, err := r.createLLMExecutor(providerData)
if err != nil {
	// Fall back to direct Claude executor for backwards compatibility
	tflog.Warn(ctx, "Failed to create LLM executor, falling back to Claude", map[string]interface{}{
		"error": err.Error(),
	})
	executor := claude.NewExecutor(providerData.ClaudeHomeDirectory, dryRun)
	// Continue with existing logic...
}

// Add helper method:
func (r *ProjectResourceFinal) createLLMExecutor(providerData *provider.ProviderData) (llm.Executor, error) {
	config := llm.Config{
		Provider:            llm.Provider(providerData.LLM),
		DryRun:              providerData.DryRun,
		Debug:               providerData.Debug,
		OutputPath:          providerData.OutputPath,
		ClaudeHomeDirectory: providerData.ClaudeHomeDirectory,
		ClaudeCodeModel:     providerData.ClaudeCodeModel,
		GeminiAPIKey:        providerData.GeminiAPIKey,
	}

	// Use LLM factory
	return llm.NewExecutor(config)
}
```

**IMPORTANT**: Keep the existing claude.Executor imports and usage as fallback to ensure 100% backwards compatibility during transition.

