# LLM Abstraction Layer - Phase 1
# Pure abstraction layer without Gemini implementation
# Maintains 100% backwards compatibility with current Claude CLI

## Overview
This specification adds an LLM abstraction layer to the Terraform provider while maintaining complete backwards compatibility with the existing Claude Code CLI implementation. This is Phase 1 of a multi-phase approach where Gemini support will be added later through the FEATURE_GEMINI_LLM.llm.yml specification.

## Goals
1. Zero breaking changes - all existing code continues to work
2. Create clean abstraction interfaces for future LLM providers
3. Refactor Claude implementation to use new interfaces
4. Add provider parameter infrastructure for future LLM selection
5. Prepare codebase for Gemini addition without implementing it

## Implementation Phases

### Phase 1: Create LLM Abstraction Interfaces

#### 1.1 Create LLM Interface Package
**File**: `internal/llm/types.go` (NEW)
```go
package llm

import (
	"context"
	"time"
)

// Provider represents an LLM provider type
type Provider string

const (
	ProviderClaudeCode Provider = "claude-code"
	ProviderGemini     Provider = "gemini" // Reserved for future use
)

// ExecutionResult contains the result of an LLM execution
type ExecutionResult struct {
	Success     bool              `json:"success"`
	Output      string            `json:"output,omitempty"`
	Error       string            `json:"error,omitempty"`
	ProjectPath string            `json:"project_path,omitempty"`
	Metadata    map[string]string `json:"metadata,omitempty"`
}

// ExecutionStatus represents the status of an LLM execution
type ExecutionStatus struct {
	State       string            `json:"state"`        // pending, running, completed, failed
	StartedAt   time.Time         `json:"started_at"`
	CompletedAt *time.Time        `json:"completed_at,omitempty"`
	ProjectPath string            `json:"project_path"`
	Error       string            `json:"error,omitempty"`
	Output      string            `json:"output,omitempty"`
	Metadata    map[string]string `json:"metadata,omitempty"`
}

// Config contains configuration for LLM providers
type Config struct {
	Provider            Provider
	DryRun              bool
	Debug               bool
	OutputPath          string

	// Claude-specific (existing functionality)
	ClaudeHomeDirectory string
	ClaudeCodeModel     string // Future: sonnet, haiku, opus

	// Gemini-specific (reserved for future)
	GeminiAPIKey   string
	GeminiModel    string
}

// Validate checks if the configuration is valid
func (c *Config) Validate() error {
	// Currently only validates Claude
	// Gemini validation will be added in Phase 2
	return nil
}
```

