#### 6.2 Unit Tests for Abstraction Layer
**File**: `internal/llm/factory_test.go` (NEW)
```go
package llm

import (
	"testing"
)

func TestNewExecutor_DefaultsClaude(t *testing.T) {
	config := Config{
		ClaudeHomeDirectory: "~/.claude",
		DryRun:              true,
	}

	executor, err := NewExecutor(config)
	if err != nil {
		t.Fatalf("NewExecutor failed: %v", err)
	}

	if executor.GetProvider() != ProviderClaudeCode {
		t.Errorf("Expected provider %s, got %s", ProviderClaudeCode, executor.GetProvider())
	}
}

func TestNewExecutor_ExplicitClaude(t *testing.T) {
	config := Config{
		Provider:            ProviderClaudeCode,
		ClaudeHomeDirectory: "~/.claude",
		DryRun:              true,
	}

	executor, err := NewExecutor(config)
	if err != nil {
		t.Fatalf("NewExecutor failed: %v", err)
	}

	if executor.GetProvider() != ProviderClaudeCode {
		t.Errorf("Expected provider %s, got %s", ProviderClaudeCode, executor.GetProvider())
	}
}

func TestNewExecutor_GeminiStub(t *testing.T) {
	config := Config{
		Provider:     ProviderGemini,
		GeminiAPIKey: "test-key",
		DryRun:       true,
	}

	executor, err := NewExecutor(config)
	if err != nil {
		t.Fatalf("NewExecutor failed: %v", err)
	}

	if executor.GetProvider() != ProviderGemini {
		t.Errorf("Expected provider %s, got %s", ProviderGemini, executor.GetProvider())
	}

	// Test that execution returns not implemented error
	_, err = executor.Execute(context.Background(), map[string]interface{}{}, "/tmp/test")
	if err == nil {
		t.Error("Expected error for Gemini stub execution")
	}
}
