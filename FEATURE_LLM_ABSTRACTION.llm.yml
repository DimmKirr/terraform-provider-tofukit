package llm

import (
	"context"
	"fmt"
)

// GeminiStub is a placeholder for future Gemini implementation
type GeminiStub struct {
	apiKey   string
	dryRun   bool
	provider Provider
}

// NewGeminiStub creates a stub for future Gemini implementation
func NewGeminiStub(apiKey string, dryRun bool) *GeminiStub {
	return &GeminiStub{
		apiKey:   apiKey,
		dryRun:   dryRun,
		provider: ProviderGemini,
	}
}

// Execute returns an error indicating Gemini is not yet implemented
func (g *GeminiStub) Execute(ctx context.Context, projectSpec map[string]interface{}, outputDir string) (*ExecutionStatus, error) {
	return nil, fmt.Errorf("Gemini LLM provider is not yet implemented. Please use 'claude-code' provider")
}

// SetDebug is a no-op for the stub
func (g *GeminiStub) SetDebug(debug bool) {}

// SetOutputPath is a no-op for the stub
func (g *GeminiStub) SetOutputPath(outputPath string) {}

// SetSystemPrompt is a no-op for the stub
func (g *GeminiStub) SetSystemPrompt(systemPrompt string) {}

// GetProvider returns the provider type
func (g *GeminiStub) GetProvider() Provider {
	return g.provider
}
