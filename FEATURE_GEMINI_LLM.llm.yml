### Phase 2: LLM Abstraction Layer

#### 2.1 Create LLM Interface
**File**: `internal/llm/interface.go` (NEW)
```go
package llm

import (
	"context"
)

// ExecutionResult contains the result of an LLM execution
type ExecutionResult struct {
	Success     bool   `json:"success"`
	Output      string `json:"output,omitempty"`
	Error       string `json:"error,omitempty"`
	ProjectPath string `json:"project_path,omitempty"`
}

// ExecutionStatus represents the status of an LLM execution
type ExecutionStatus struct {
	State       string            `json:"state"`        // pending, running, completed, failed
	StartedAt   string            `json:"started_at"`   // RFC3339 timestamp
	CompletedAt string            `json:"completed_at"` // RFC3339 timestamp
	ProjectPath string            `json:"project_path"`
	Error       string            `json:"error,omitempty"`
	Output      string            `json:"output,omitempty"`
	Metadata    map[string]string `json:"metadata,omitempty"`
}

// Client defines the interface that all LLM providers must implement
type Client interface {
	// Execute runs the LLM with the provided project specification
	Execute(ctx context.Context, projectSpec map[string]interface{}, outputPath string) (*ExecutionResult, error)

	// Validate checks if the LLM client is properly configured and available
	Validate(ctx context.Context) error

	// SetSystemPrompt sets a custom system prompt for the LLM
	SetSystemPrompt(systemPrompt string)

	// BuildPrompt creates the prompt from project specification
	BuildPrompt(projectSpec map[string]interface{}) (string, error)

	// IsDryRun returns whether the client is in dry-run mode
	IsDryRun() bool
}

// Executor manages LLM execution lifecycle for Terraform resources
type Executor interface {
	// Execute runs the LLM with the provided project specification
	Execute(ctx context.Context, projectSpec map[string]interface{}, outputDir string) (*ExecutionStatus, error)

	// Validate checks if LLM execution would be possible
	Validate(ctx context.Context) error

	// SetDebug enables or disables debug mode
	SetDebug(debug bool)

	// SetOutputPath sets the output path for debug files
	SetOutputPath(outputPath string)

	// SetSystemPrompt sets the custom system prompt
	SetSystemPrompt(systemPrompt string)

	// IsProjectGenerated checks if a project has been generated at the specified path
	IsProjectGenerated(ctx context.Context, projectPath string) bool

	// CleanupProject removes the generated project directory
	CleanupProject(ctx context.Context, projectPath string) error

	// RetryExecution attempts to retry a failed execution
	RetryExecution(ctx context.Context, projectSpec map[string]interface{}, outputDir string, maxRetries int) (*ExecutionStatus, error)
}
```

#### 2.2 Create LLM Factory
**File**: `internal/llm/factory.go` (NEW)
```go
package llm

import (
	"fmt"

	"github.com/tofukit/opentofu-provider-tofukit/internal/claude"
	"github.com/tofukit/opentofu-provider-tofukit/internal/gemini"
)

// Config contains configuration for LLM clients
type Config struct {
	LLM                 string
	DryRun              bool
	Debug               bool
	ClaudeHomeDirectory string
	ClaudeCodeModel     string
	GeminiAPIKey        string
}

// NewExecutor creates an appropriate LLM executor based on configuration
func NewExecutor(config Config) (Executor, error) {
	switch config.LLM {
	case "claude-code":
		executor := claude.NewExecutor(config.ClaudeHomeDirectory, config.DryRun)
		executor.SetDebug(config.Debug)
		if config.ClaudeCodeModel != "" {
			executor.SetModel(config.ClaudeCodeModel)
		}
		return executor, nil

	case "gemini":
		if config.GeminiAPIKey == "" {
			return nil, fmt.Errorf("Gemini API key is required when using Gemini LLM")
		}
		executor := gemini.NewExecutor(config.GeminiAPIKey, config.DryRun)
		executor.SetDebug(config.Debug)
		return executor, nil

	default:
		return nil, fmt.Errorf("unsupported LLM provider: %s", config.LLM)
	}
}

// NewClient creates an appropriate LLM client based on configuration
func NewClient(config Config) (Client, error) {
	switch config.LLM {
	case "claude-code":
		client := claude.NewClient(config.ClaudeHomeDirectory, config.DryRun)
		if config.ClaudeCodeModel != "" {
			client.SetModel(config.ClaudeCodeModel)
		}
		return client, nil

	case "gemini":
		if config.GeminiAPIKey == "" {
			return nil, fmt.Errorf("Gemini API key is required when using Gemini LLM")
		}
		return gemini.NewClient(config.GeminiAPIKey, config.DryRun)

	default:
		return nil, fmt.Errorf("unsupported LLM provider: %s", config.LLM)
	}
}
