# Migration Guide

## Upgrading to Multi-LLM Support

This version introduces support for multiple LLM providers. Existing configurations using Claude Code will continue to work without changes.

### Backward Compatibility

All existing provider configurations remain valid:

```hcl
# This continues to work exactly as before
provider "tofukit" {
  claude_home_directory = "~/.claude"
  dry_run = false
  debug = true
}
