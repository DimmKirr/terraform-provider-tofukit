#### 9.1 Enhanced Validation
**File**: `internal/provider/validation.go` (NEW)
```go
package provider

import (
	"fmt"
	"os"
)

// ValidateConfig validates the provider configuration for consistency
func ValidateConfig(config *ProviderData) error {
	// Validate LLM-specific configuration
	switch config.LLM {
	case "claude-code":
		return validateClaudeConfig(config)
	case "gemini":
		return validateGeminiConfig(config)
	default:
		return fmt.Errorf("unsupported LLM provider: %s", config.LLM)
	}
}

func validateClaudeConfig(config *ProviderData) error {
	// Check if Claude Code is installed (only in non-dry-run mode)
	if !config.DryRun {
		// This will be validated by the Claude client itself
	}

	// Validate model selection
	validModels := map[string]bool{
		"sonnet": true,
		"haiku":  true,
		"opus":   true,
	}

	if !validModels[config.ClaudeCodeModel] {
		return fmt.Errorf("invalid Claude Code model: %s", config.ClaudeCodeModel)
	}

	return nil
}

func validateGeminiConfig(config *ProviderData) error {
	// Check API key is available
	apiKey := config.GeminiAPIKey
	if apiKey == "" {
		apiKey = os.Getenv("GEMINI_API_KEY")
	}

	if apiKey == "" {
		return fmt.Errorf("Gemini API key is required when using Gemini LLM")
	}

	return nil
}
```

