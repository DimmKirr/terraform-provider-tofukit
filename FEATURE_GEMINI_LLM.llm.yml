# TofuKit Provider

## Configuration

### LLM Provider Selection

The provider supports multiple LLM backends:

- **Claude Code** (default): Uses Anthropic's Claude through the Claude Code CLI
- **Gemini**: Uses Google's Gemini API directly

```hcl
provider "tofukit" {
  llm = "claude-code"  # or "gemini"

  # Claude Code specific configuration
  claude_code_model    = "sonnet"  # sonnet, haiku, opus
  claude_home_directory = "~/.claude"

  # Gemini specific configuration
  gemini_api_key = "your-api-key"  # or set GEMINI_API_KEY env var
}
```

### Authentication

#### Claude Code
Follow the Claude Code CLI setup instructions. The provider uses your existing Claude Code authentication.

#### Gemini
Obtain an API key from Google AI Studio and either:
1. Set the `gemini_api_key` parameter in the provider configuration
2. Set the `GEMINI_API_KEY` environment variable
```

