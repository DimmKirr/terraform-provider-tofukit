## Critical Design Decisions

### 1. Interface Abstraction
The LLM interface abstracts execution, validation, and configuration while maintaining compatibility with existing Claude patterns.

### 2. Backward Compatibility
All existing Claude Code configurations continue to work unchanged. New parameters are optional with sensible defaults.

### 3. Error Handling
Comprehensive validation ensures clear error messages for misconfiguration. LLM-specific errors are properly surfaced.

### 4. Dry-Run Support
Both Claude Code and Gemini support dry-run mode for testing without actual LLM execution.

### 5. Debug Support
Debug mode creates metadata files and saves prompts/responses for both LLM providers.

### 6. Model Selection
Claude Code models can be specified via `claude_code_model` parameter. Gemini uses sensible defaults but can be extended.

## Testing Strategy

### Unit Tests
- LLM factory creation and validation
- Provider configuration validation
- Interface compliance tests

### Integration Tests
- End-to-end project creation with both LLMs
- Configuration validation scenarios
- Error handling paths
- Dry-run mode verification

### Compatibility Tests
- Existing Claude Code configurations
- Upgrade scenarios
- Resource state consistency

## Security Considerations

### API Key Handling
- Gemini API keys are marked as sensitive in schema
- Support environment variable fallback
- Keys are not logged or exposed in debug output

### Authentication
- Claude Code uses existing CLI authentication
- Gemini uses API key authentication
- No authentication credentials stored in state

### Validation
- API keys validated at configuration time
- LLM availability checked before execution
- Clear error messages without exposing secrets

This comprehensive specification provides a complete roadmap for implementing multi-LLM support while maintaining backward compatibility and following Go/Terraform best practices.