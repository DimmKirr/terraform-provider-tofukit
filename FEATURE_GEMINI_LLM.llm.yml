### New Configuration Options

To explicitly specify the LLM provider:

```hcl
provider "tofukit" {
  llm = "claude-code"  # Explicit (same as default)
  claude_code_model = "sonnet"  # New: specify model
}
```

To use Gemini:

```hcl
provider "tofukit" {
  llm = "gemini"
  gemini_api_key = "your-key"
}
```
