#### 3.2 Create Gemini Executor
**File**: `internal/gemini/executor.go` (NEW)
```go
package gemini

import (
	"context"
	"encoding/json"
	"fmt"
	"os"
	"path/filepath"
	"time"

	"github.com/hashicorp/terraform-plugin-log/tflog"
	"github.com/tofukit/opentofu-provider-tofukit/internal/llm"
)

// Executor manages Gemini execution lifecycle for Terraform resources
type Executor struct {
	client     *Client
	debug      bool
	outputPath string
}

// NewExecutor creates a new Gemini executor
func NewExecutor(apiKey string, dryRun bool) *Executor {
	return &Executor{
		client: NewClient(apiKey, dryRun),
		debug:  false,
	}
}

// SetDebug enables or disables debug mode
func (e *Executor) SetDebug(debug bool) {
	e.debug = debug
}

// SetOutputPath sets the output path for debug files
func (e *Executor) SetOutputPath(outputPath string) {
	e.outputPath = outputPath
}

// SetSystemPrompt sets the custom system prompt
func (e *Executor) SetSystemPrompt(systemPrompt string) {
	e.client.SetSystemPrompt(systemPrompt)
}

// SetModel sets the Gemini model to use
func (e *Executor) SetModel(model string) {
	e.client.SetModel(model)
}

// Execute runs Gemini with the provided project specification
func (e *Executor) Execute(ctx context.Context, projectSpec map[string]interface{}, outputDir string) (*llm.ExecutionStatus, error) {
	tflog.Info(ctx, "Starting Gemini execution", map[string]interface{}{
		"output_dir": outputDir,
	})

	// Validate Gemini is available (skip in dry-run)
	if !e.client.IsDryRun() {
		if err := e.client.Validate(ctx); err != nil {
			tflog.Error(ctx, "Gemini validation failed", map[string]interface{}{
				"error": err.Error(),
			})
			return &llm.ExecutionStatus{
				State:     "failed",
				StartedAt: time.Now().Format(time.RFC3339),
				Error:     fmt.Sprintf("Gemini validation failed: %v", err),
			}, err
		}
	}

	// Create execution status
	status := &llm.ExecutionStatus{
		State:     "running",
		StartedAt: time.Now().Format(time.RFC3339),
		Metadata:  make(map[string]string),
	}

	// Extract project information for metadata
	if project, ok := projectSpec["project"].(map[string]interface{}); ok {
		if name, ok := project["name"].(string); ok {
			status.Metadata["project_name"] = name
		}
		if version, ok := project["version"].(string); ok {
			status.Metadata["project_version"] = version
		}
	}

	// Determine project path
	projectName := "project"
	if project, ok := projectSpec["project"].(map[string]interface{}); ok {
		if name, ok := project["name"].(string); ok {
			projectName = name
		}
	}
	projectPath := filepath.Join(outputDir, projectName)
	status.ProjectPath = projectPath

	// Ensure project directory exists
	if err := os.MkdirAll(projectPath, 0755); err != nil {
		tflog.Error(ctx, "Failed to create project directory", map[string]interface{}{
			"path":  projectPath,
			"error": err.Error(),
		})
		status.State = "failed"
		status.CompletedAt = time.Now().Format(time.RFC3339)
		status.Error = fmt.Sprintf("Failed to create project directory: %v", err)
		return status, err
	}

	// Execute Gemini with timeout
	execCtx, cancel := context.WithTimeout(ctx, 10*time.Minute)
	defer cancel()

	result, err := e.client.Execute(execCtx, projectSpec, projectPath)
	if err != nil {
		tflog.Error(ctx, "Gemini execution failed", map[string]interface{}{
			"error": err.Error(),
		})
		status.State = "failed"
		status.CompletedAt = time.Now().Format(time.RFC3339)
		status.Error = err.Error()

		// Save failure metadata for debugging
		if saveErr := e.saveExecutionMetadata(ctx, status, outputDir); saveErr != nil {
			tflog.Warn(ctx, "Failed to save failure metadata", map[string]interface{}{
				"error": saveErr.Error(),
			})
		}

		return status, err
	}

	// Update status with results
	status.CompletedAt = time.Now().Format(time.RFC3339)
	status.Output = result.Output
	status.ProjectPath = result.ProjectPath
	status.State = "completed"

	// Save execution metadata
	if err := e.saveExecutionMetadata(ctx, status, outputDir); err != nil {
		tflog.Warn(ctx, "Failed to save execution metadata", map[string]interface{}{
			"error": err.Error(),
		})
	}

	tflog.Info(ctx, "Gemini execution completed successfully", map[string]interface{}{
		"project_path": status.ProjectPath,
	})

	return status, nil
}

// Validate checks if Gemini execution would be possible
func (e *Executor) Validate(ctx context.Context) error {
	return e.client.Validate(ctx)
}

// saveExecutionMetadata saves execution information to a metadata file
func (e *Executor) saveExecutionMetadata(ctx context.Context, status *llm.ExecutionStatus, outputDir string) error {
	// Create .debug directory
	debugDir := filepath.Join(outputDir, ".debug")
	if err := os.MkdirAll(debugDir, 0755); err != nil {
		return fmt.Errorf("failed to create .debug directory: %w", err)
	}

	timestamp := time.Now().Unix()
	metadataPath := filepath.Join(debugDir, fmt.Sprintf("gemini-execution-metadata-%d.json", timestamp))

	// Create metadata structure
	metadata := map[string]interface{}{
		"execution_status": status,
		"created_at":       time.Now().Format(time.RFC3339),
		"terraform_provider": map[string]string{
			"name":   "tofukit",
			"action": "gemini_execution",
		},
	}

	// Marshal to JSON
	data, err := json.MarshalIndent(metadata, "", "  ")
	if err != nil {
		return fmt.Errorf("failed to marshal metadata: %w", err)
	}

	// Write to file
	if err := os.WriteFile(metadataPath, data, 0644); err != nil {
		return fmt.Errorf("failed to write metadata file: %w", err)
	}

	tflog.Debug(ctx, "Saved execution metadata", map[string]interface{}{
		"metadata_path": metadataPath,
	})

	return nil
}

// IsProjectGenerated checks if a project has been generated at the specified path
func (e *Executor) IsProjectGenerated(ctx context.Context, projectPath string) bool {
	if projectPath == "" {
		return false
	}

	// Check if project directory exists and has content
	if stat, err := os.Stat(projectPath); err == nil && stat.IsDir() {
		entries, err := os.ReadDir(projectPath)
		if err == nil && len(entries) > 0 {
			return true
		}
	}

	return false
}

// CleanupProject removes the generated project directory
func (e *Executor) CleanupProject(ctx context.Context, projectPath string) error {
	if projectPath == "" {
		return nil
	}

	if err := os.RemoveAll(projectPath); err != nil {
		return fmt.Errorf("failed to cleanup project directory: %w", err)
	}

	return nil
}

// RetryExecution attempts to retry a failed execution
func (e *Executor) RetryExecution(ctx context.Context, projectSpec map[string]interface{}, outputDir string, maxRetries int) (*llm.ExecutionStatus, error) {
	var lastErr error
	var lastStatus *llm.ExecutionStatus

	for attempt := 1; attempt <= maxRetries; attempt++ {
		tflog.Info(ctx, "Attempting Gemini execution", map[string]interface{}{
			"attempt":     attempt,
			"max_retries": maxRetries,
		})

		status, err := e.Execute(ctx, projectSpec, outputDir)
		if err == nil && status.State == "completed" {
			return status, nil
		}

		lastErr = err
		lastStatus = status

		if attempt < maxRetries {
			waitTime := time.Duration(attempt*attempt) * time.Second
			tflog.Info(ctx, "Retrying Gemini execution", map[string]interface{}{
				"attempt":   attempt,
				"wait_time": waitTime.String(),
			})

			select {
			case <-ctx.Done():
				return lastStatus, ctx.Err()
			case <-time.After(waitTime):
				// Continue
			}
		}
	}

	return lastStatus, fmt.Errorf("execution failed after %d attempts: %w", maxRetries, lastErr)
}
```

