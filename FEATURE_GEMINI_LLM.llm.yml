# Multi-LLM Support Feature Specification
# Implementation of Google Gemini alongside existing Claude Code support

## Overview
This feature adds support for multiple LLM providers (Claude Code and Google Gemini) to the Terraform provider, allowing users to choose their preferred LLM for project generation.

## Requirements Summary
1. Add provider parameters for LLM selection and configuration
2. Create LLM abstraction layer with common interface
3. Implement Gemini client using googleapis/go-genai SDK
4. Maintain backward compatibility with existing Claude Code integration
5. Add configuration validation and error handling
6. Update resource implementations to use abstracted LLM interface

