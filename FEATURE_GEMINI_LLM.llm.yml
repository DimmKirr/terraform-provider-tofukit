### Phase 3: Gemini Implementation

#### 3.1 Create Gemini Client
**File**: `internal/gemini/client.go` (NEW)
```go
package gemini

import (
	"bytes"
	"context"
	"encoding/json"
	"fmt"
	"os"
	"path/filepath"
	"strings"
	"text/template"
	"time"

	"github.com/google/generative-ai-go/genai"
	"github.com/hashicorp/terraform-plugin-log/tflog"
	"google.golang.org/api/option"

	"github.com/tofukit/opentofu-provider-tofukit/internal/claude" // For shared prompt types
)

// Client implements the LLM interface for Google Gemini
type Client struct {
	apiKey       string
	dryRun       bool
	systemPrompt string
	model        string // e.g., "gemini-1.5-pro", "gemini-1.5-flash"
}

// NewClient creates a new Gemini client
func NewClient(apiKey string, dryRun bool) *Client {
	return &Client{
		apiKey: apiKey,
		dryRun: dryRun,
		model:  "gemini-1.5-pro", // Default model
	}
}

// SetModel sets the Gemini model to use
func (c *Client) SetModel(model string) {
	c.model = model
}

// SetSystemPrompt sets the custom system prompt
func (c *Client) SetSystemPrompt(systemPrompt string) {
	c.systemPrompt = systemPrompt
}

// IsDryRun returns whether the client is in dry-run mode
func (c *Client) IsDryRun() bool {
	return c.dryRun
}

// Validate checks if Gemini API is accessible with the provided key
func (c *Client) Validate(ctx context.Context) error {
	if c.apiKey == "" {
		return fmt.Errorf("Gemini API key is required")
	}

	// Test API connection with a simple request
	client, err := genai.NewClient(ctx, option.WithAPIKey(c.apiKey))
	if err != nil {
		return fmt.Errorf("failed to create Gemini client: %w", err)
	}
	defer client.Close()

	// Try to get a list of models to validate the API key
	models := client.ListModels(ctx)
	if _, err := models.Next(); err != nil {
		return fmt.Errorf("failed to validate Gemini API key: %w", err)
	}

	return nil
}

// Execute executes Gemini with the provided project specification
func (c *Client) Execute(ctx context.Context, projectSpec map[string]interface{}, outputPath string) (*ExecutionResult, error) {
	tflog.Info(ctx, "Starting Gemini execution", map[string]interface{}{
		"output_path": outputPath,
		"dry_run":     c.dryRun,
		"model":       c.model,
	})

	// If in dry run mode, skip actual execution
	if c.dryRun {
		tflog.Info(ctx, "Dry run mode - skipping Gemini execution")

		// Create output directory and sample file
		if err := os.MkdirAll(outputPath, 0755); err != nil {
			return nil, fmt.Errorf("failed to create output directory: %w", err)
		}

		testFile := filepath.Join(outputPath, "dryrun-test.txt")
		if err := os.WriteFile(testFile, []byte("This file was created in dry-run mode using Gemini"), 0644); err != nil {
			return nil, fmt.Errorf("failed to create dry-run test file: %w", err)
		}

		return &ExecutionResult{
			Success:     true,
			Output:      "Dry run mode - Gemini execution skipped",
			ProjectPath: outputPath,
		}, nil
	}

	// Build the prompt
	prompt, err := c.BuildPrompt(projectSpec)
	if err != nil {
		return nil, fmt.Errorf("failed to build prompt: %w", err)
	}

	// Create Gemini client
	client, err := genai.NewClient(ctx, option.WithAPIKey(c.apiKey))
	if err != nil {
		return nil, fmt.Errorf("failed to create Gemini client: %w", err)
	}
	defer client.Close()

	// Get the model
	model := client.GenerativeModel(c.model)

	// Configure model settings
	model.SetTemperature(0.1) // Low temperature for consistent code generation
	model.SetTopP(0.8)
	model.SetTopK(10)
	model.SetMaxOutputTokens(8192)

	// Set system instruction if available
	systemPrompt := c.systemPrompt
	if systemPrompt == "" {
		systemPrompt = claude.DefaultSystemPrompt() // Reuse Claude's system prompt
	}
	model.SystemInstruction = &genai.Content{
		Parts: []genai.Part{genai.Text(systemPrompt)},
	}

	// Save prompt for debugging
	promptPath := filepath.Join(filepath.Dir(outputPath), "gemini-prompt.txt")
	if err := os.WriteFile(promptPath, []byte(prompt), 0644); err != nil {
		tflog.Warn(ctx, "Failed to save prompt to file", map[string]interface{}{
			"error": err.Error(),
		})
	}

	// Create output directory
	if err := os.MkdirAll(outputPath, 0755); err != nil {
		return nil, fmt.Errorf("failed to create output directory: %w", err)
	}

	// Execute the request
	tflog.Debug(ctx, "Sending request to Gemini", map[string]interface{}{
		"model":         c.model,
		"prompt_length": len(prompt),
	})

	resp, err := model.GenerateContent(ctx, genai.Text(prompt))
	if err != nil {
		return nil, fmt.Errorf("Gemini API request failed: %w", err)
	}

	// Process response
	if resp == nil || len(resp.Candidates) == 0 {
		return nil, fmt.Errorf("no response from Gemini")
	}

	candidate := resp.Candidates[0]
	if candidate.Content == nil || len(candidate.Content.Parts) == 0 {
		return nil, fmt.Errorf("empty response from Gemini")
	}

	// Extract text response
	var outputText strings.Builder
	for _, part := range candidate.Content.Parts {
		if text, ok := part.(genai.Text); ok {
			outputText.WriteString(string(text))
		}
	}

	output := outputText.String()

	// Save response for debugging
	responsePath := filepath.Join(filepath.Dir(outputPath), "gemini-response.txt")
	os.WriteFile(responsePath, []byte(output), 0644)

	// Process the Gemini response to create project files
	if err := c.processGeminiResponse(ctx, output, outputPath); err != nil {
		return nil, fmt.Errorf("failed to process Gemini response: %w", err)
	}

	tflog.Info(ctx, "Gemini execution completed", map[string]interface{}{
		"project_path":  outputPath,
		"output_length": len(output),
	})

	return &ExecutionResult{
		Success:     true,
		Output:      output,
		ProjectPath: outputPath,
	}, nil
}

// BuildPrompt creates the prompt for Gemini from project specification
func (c *Client) BuildPrompt(projectSpec map[string]interface{}) (string, error) {
	// Reuse Claude's prompt building logic but adapt for Gemini
	prompt := claude.BuildProjectPrompt(projectSpec, c.systemPrompt)

	// Convert to markdown format (Gemini works well with markdown)
	return prompt.ToMarkdown(), nil
}

// processGeminiResponse processes the text response from Gemini and creates project files
func (c *Client) processGeminiResponse(ctx context.Context, response, outputPath string) error {
	// Since Gemini returns text (not code execution), we need to parse the response
	// and extract file content that should be created

	// Look for code blocks and file creation instructions
	// This is a simplified implementation - in practice, you might want more sophisticated parsing

	// For now, save the full response as a README file
	readmePath := filepath.Join(outputPath, "GEMINI_RESPONSE.md")
	if err := os.WriteFile(readmePath, []byte(response), 0644); err != nil {
		return fmt.Errorf("failed to write Gemini response: %w", err)
	}

	// TODO: Implement more sophisticated response parsing to extract:
	// - File creation instructions
	// - Code blocks with specific filenames
	// - Directory structure
	// - Command execution

	tflog.Info(ctx, "Saved Gemini response", map[string]interface{}{
		"path": readmePath,
	})

	return nil
}
