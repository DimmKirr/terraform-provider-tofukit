**Configuration Validation**:
```go
func (p *TofukitProvider) Configure(ctx context.Context, req provider.ConfigureRequest, resp *provider.ConfigureResponse) {
	var data TofukitProviderModel
	resp.Diagnostics.Append(req.Config.Get(ctx, &data)...)
	if resp.Diagnostics.HasError() {
		return
	}

	// Set defaults
	llm := "claude-code"
	claudeCodeModel := "sonnet"
	geminiAPIKey := os.Getenv("GEMINI_API_KEY")

	if !data.LLM.IsNull() {
		llm = data.LLM.ValueString()
	}
	if !data.ClaudeCodeModel.IsNull() {
		claudeCodeModel = data.ClaudeCodeModel.ValueString()
	}
	if !data.GeminiAPIKey.IsNull() {
		geminiAPIKey = data.GeminiAPIKey.ValueString()
	}

	// Validate LLM selection
	switch llm {
	case "claude-code", "gemini":
		// Valid options
	default:
		resp.Diagnostics.AddError(
			"Invalid LLM Provider",
			fmt.Sprintf("Unsupported LLM provider: %s. Supported options: claude-code, gemini", llm),
		)
		return
	}

	// Validate Gemini configuration
	if llm == "gemini" && geminiAPIKey == "" {
		resp.Diagnostics.AddError(
			"Missing Gemini API Key",
			"When using Gemini LLM, you must provide an API key via 'gemini_api_key' parameter or GEMINI_API_KEY environment variable",
		)
		return
	}

	// Validate Claude Code model
	if llm == "claude-code" {
		validModels := []string{"sonnet", "haiku", "opus"}
		isValid := false
		for _, model := range validModels {
			if claudeCodeModel == model {
				isValid = true
				break
			}
		}
		if !isValid {
			resp.Diagnostics.AddError(
				"Invalid Claude Code Model",
				fmt.Sprintf("Unsupported Claude Code model: %s. Supported options: %v", claudeCodeModel, validModels),
			)
			return
		}
	}

	providerData := &ProviderData{
		// ... existing fields ...
		LLM:                 llm,
		ClaudeCodeModel:     claudeCodeModel,
		GeminiAPIKey:        geminiAPIKey,
	}

	resp.DataSourceData = providerData
	resp.ResourceData = providerData
}
