version: '3'

includes:
  claude:
    taskfile: ~/dev/Taskfile.yml
    flatten: true

vars:
  VERSION: 0.1.0
  BIN_DIR: bin
  BINARY_NAME: terraform-provider-tofukit_v0.1.0
  # We dont' destroy resources in tests for now
  SKIP_DESTROY: true
  TEST_TIMEOUT: 20m
  GOOS:
    sh: go env GOOS
  GOARCH:
    sh: go env GOARCH

env:
  ASDF_GOLANG_MOD_VERSION_ENABLED: true
  SKIP_DESTROY: "{{.SKIP_DESTROY}}"

tasks:
  build:
    desc: Build the provider binary
    vars:
      BINARY: terraform-provider-tofukit_v0.1.0
      BIN_PLATFORM_DIR: bin/{{.GOOS}}_{{.GOARCH}}
    cmds:
      - mkdir -p {{.BIN_PLATFORM_DIR}}
      - CGO_ENABLED=0 go build -o {{.BIN_PLATFORM_DIR}}/{{.BINARY}} .

  install:
    desc: Install the provider locally
    deps: [build]
    vars:
      BINARY: terraform-provider-tofukit_v0.1.0
      BIN_PLATFORM_DIR: bin/{{.GOOS}}_{{.GOARCH}}
      PLUGIN_DIR: ~/.terraform.d/plugins/registry.terraform.io/DimmKirr/tofukit/0.1.0
    cmds:
      - mkdir -p {{.PLUGIN_DIR}}/{{.GOOS}}_{{.GOARCH}}
      - cp {{.BIN_PLATFORM_DIR}}/{{.BINARY}} {{.PLUGIN_DIR}}/{{.GOOS}}_{{.GOARCH}}/{{.BINARY}}
      - |
        if [ "{{.GOOS}}" = "darwin" ]; then
          echo "Signing binary on macOS..."
          codesign -s - -f {{.PLUGIN_DIR}}/{{.GOOS}}_{{.GOARCH}}/{{.BINARY}} 2>/dev/null || true
          echo "Binary signed successfully"
        fi

  test:
    desc: Run all tests sequentially to avoid resource exhaustion
    cmds:
      - task: test:data_query
      - task: test:e2e_project_example_hello_world
      - task: test:e2e_project_example_click_cli
      - task: test:e2e_project_example_go_viper_cli_hello_world
      - task: test:resource_project_inline_file


  test:data_query:
    desc: Run query tests
    deps: [build, install]
    cmds:
      - go test ./test -v -run TestDataQuery -timeout={{.TEST_TIMEOUT}}

  test:e2e_project_example_hello_world:
    desc: Run example hello world tests
    deps: [build, install]
    cmds:
      - go test ./test -v -run TestE2EProjectExampleHelloWorld -timeout={{.TEST_TIMEOUT}}

  test:e2e_project_example_click_cli:
    desc: Run example click CLI tests
    deps: [build, install]
    cmds:
      - go test ./test -v -run TestE2EProjectExampleClickCli -timeout={{.TEST_TIMEOUT}}

  test:e2e_project_example_go_viper_cli_hello_world:
    desc: Run example Go Viper CLI tests
    deps: [build, install]
    cmds:
      - go test ./test -v -run TestE2EProjectExampleGoViperCliHelloWorld -timeout={{.TEST_TIMEOUT}}

  test:resource_project_inline_file:
    desc: Run project files tests
    deps: [build, install]
    cmds:
      - go test ./test -v -run TestResourceProjectInlineFileCreateSuccess -timeout={{.TEST_TIMEOUT}}

  docs:
    desc: Generate provider documentation
    cmds:
      - tfplugindocs generate

