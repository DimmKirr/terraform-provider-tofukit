version: '3'

includes:
  claude:
    taskfile: ~/dev/Taskfile.yml
    flatten: true

vars:
  VERSION: 0.1.0
  BIN_DIR: bin
  BINARY_NAME: terraform-provider-tofukit_v0.1.0
  GOOS:
    sh: go env GOOS
  GOARCH:
    sh: go env GOARCH

tasks:
  build:
    desc: Build the provider binary
    vars:
      BINARY: terraform-provider-tofukit_v0.1.0
    cmds:
      - mkdir -p bin
      - CGO_ENABLED=0 go build -o bin/{{.BINARY}} .

  install:
    desc: Install the provider locally
    deps: [build]
    vars:
      BINARY: terraform-provider-tofukit_v0.1.0
      PLUGIN_DIR: ~/.terraform.d/plugins/registry.terraform.io/DimmKirr/tofukit/0.1.0
    cmds:
      - mkdir -p {{.PLUGIN_DIR}}/{{.GOOS}}_{{.GOARCH}}
      - cp bin/{{.BINARY}} {{.PLUGIN_DIR}}/{{.GOOS}}_{{.GOARCH}}/{{.BINARY}}
      - |
        if [ "{{.GOOS}}" = "darwin" ]; then
          echo "Signing binary on macOS..."
          codesign -s - -f {{.PLUGIN_DIR}}/{{.GOOS}}_{{.GOARCH}}/{{.BINARY}} 2>/dev/null || true
          echo "Binary signed successfully"
        fi

  test:
    deps:
      - build
      - install
#      - test:data_hello_world_txt_test # no data test for now
      - test:project_hello_world_txt_test


  ### Tests ###
  test:data_hello_world_txt_test:
    deps:
      - build
      - install

    desc: Run data_hello_world_txt_test
    env:
      TF_LOG: INFO
    cmds:
      - go test ./test -v -run TestDataQuerySimple

  test:project_hello_world_txt_test:
    deps:
      - build
      - install

    desc: Run project_hello_world_txt_test
    env:
      TF_LOG: INFO
    cmds:
      - go test ./test -v -run TestProjectHelloWorldTxtCreateSuccess
      - go test ./test -v -run TestProjectHelloWorldTxtRemovalSuccess


  test:project_verification_retry_test:
    deps:
      - build
      - install

    desc: Run project_verification_retry_test
    env:
      TF_LOG: DEBUG
    cmds:
      - go test ./test -v -run TestProjectVerificationRetry

  test:project_click_cli_test:
    deps:
      - build
      - install

    desc: Run project_click_cli_test
    env:
      TF_LOG: DEBUG
    cmds:
      - go test ./test -v -run TestProjectClickCLI

  test:project_rename_test:
